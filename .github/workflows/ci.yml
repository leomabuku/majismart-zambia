name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Node 24 + SQLite)
    runs-on: ubuntu-latest
    env:
      # The suite boots the real server and authenticates against seeded accounts,
      # so CI must supply the same variables production requires.
      JWT_SECRET: ci-only-not-a-real-secret
      IOT_API_KEY: ci-only-device-key
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: BACKEND/package-lock.json
      - run: npm ci
        working-directory: BACKEND
      - run: npm test
        working-directory: BACKEND

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: WEB/package-lock.json
      - run: npm ci
        working-directory: WEB
      - run: npm test
        working-directory: WEB
      - run: npm run build
        working-directory: WEB
        env:
          # Repository variable, so CI builds the same API origin production uses.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://majismart-api.onrender.com/api' }}

  # Optional: apply reviewed migrations to Supabase before the API deploys.
  # Requires repository secrets SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF,
  # SUPABASE_DB_PASSWORD. Safe to delete if you run migrations from a laptop.
  migrate:
    name: Apply Supabase migrations
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Supabase secrets not configured - skipping migrations."
            exit 0
          fi
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase db push --include-all
