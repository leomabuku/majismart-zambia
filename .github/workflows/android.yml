name: Android build
on:
  pull_request:
    paths: ['APP/android/**', '.github/workflows/android.yml']
  push:
    branches: [main, arena/b49ba57d-majismart-zambia]
    paths: ['APP/android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build and lint debug app
        working-directory: APP/android
        run: bash gradlew --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: majismart-android-debug
          path: APP/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
