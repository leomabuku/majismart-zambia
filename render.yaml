services:
  - type: web
    name: majismart-api
    runtime: node
    # Frankfurt keeps the API in the same region as the Supabase project.
    # Cross-region queries cost ~150 ms each; co-located queries cost ~1-3 ms.
    region: frankfurt
    # Free instances spin down after 15 minutes of inactivity, which kills the SSE
    # hub and pauses the device-offline monitor. Starter is required for production.
    plan: starter
    buildCommand: npm ci --prefix BACKEND
    startCommand: npm start --prefix BACKEND
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: DB_MODE
        value: supabase
      - key: DATABASE_URL
        sync: false
      # Schema changes are applied by CI (`supabase db push`), not at boot.
      - key: AUTO_MIGRATE
        value: 'false'
      - key: DB_POOL_MAX
        value: '5'
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: PORT
        value: '10000'
      - key: JWT_SECRET
        sync: false
      - key: IOT_API_KEY
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_CUSTOMER_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DEVICE_OFFLINE_TIMEOUT_SECONDS
        value: '60'
